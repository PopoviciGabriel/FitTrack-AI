<!doctype html>
<html lang="ro" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FitTrack Pro</title>
  <meta name="description"
    content="Aplicație de fitness & hipertrofie: antrenamente, nutriție macro, analize AI și progressive overload." />
  <meta property="og:title" content="FitTrack" />
  <meta property="og:description"
    content="Aplicație de fitness & hipertrofie: antrenamente, nutriție macro, analize AI și progressive overload." />

  <!-- iOS standalone: bara de status e opacă, colorată după theme-color (sincronizat cu tema din App.tsx), cu text nativ negru/alb -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FitTrack" />
  <meta name="application-name" content="FitTrack" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f4f7f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <script>
    // Înainte de primul paint: tema din aplicație poate diferi de cea a sistemului, iar iOS preia culoarea barei de status la pornire.
    (function () {
      var dark = true;
      try {
        dark = localStorage.getItem("app-theme") !== "light";
      } catch (e) {}
      document.documentElement.classList.toggle("dark", dark);
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#000000" : "#f4f7f0");
    })();
  </script>

  <!-- Manifestul web (manifest.webmanifest) este generat și injectat automat de vite-plugin-pwa -->

  <!-- Iconițe Apple Touch & Browser -->
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
</head>

<body class="select-none overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
